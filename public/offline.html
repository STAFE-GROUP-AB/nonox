<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171C">
<title>Ingen anslutning – NONOX</title>
<link rel="icon" type="image/svg+xml" href="/brand/nonox-icon.svg">
<style>
  :root { color-scheme: light dark; --bg: #f7f5f0; --fg: #15171C; --muted: #5d6070; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171C; --fg: #f7f5f0; --muted: #a4a7b4; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { margin: 0 0 10px; color: var(--muted); }
  a { display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 10px; background: #FF5A36; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/brand/nonox-icon.svg" alt="">
  <h1>Ingen anslutning</h1>
  <p>NONOX behöver internet för att visa och spara uppgifter. Inget av det du arbetat med sparas i telefonen eller datorn.</p>
  <p>Kontrollera anslutningen och försök igen.</p>
  <a href="/oversikt">Försök igen</a>
</main>
</body>
</html>
