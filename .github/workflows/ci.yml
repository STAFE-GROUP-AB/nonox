name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Pint & Larastan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, bcmath
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan (level 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    name: Pest on PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nonox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: nonox_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, bcmath
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: npm ci

      - run: npm run build

      - name: JavaScript tests (invoice row calculations)
        run: npm test

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate test database
        run: php artisan migrate --force

      # ADR-077: demos live in a database of their own (nonox_test_demo here), with the full schema.
      - name: Migrate demo database
        run: php artisan migrate --database=demo --force

      # ADR-058 stage E.3: the pinned Bolagsverket XBRL taxonomy (SHA-256 verified by the script,
      # fail closed) is cached by the script's hash, so a changed pin refetches and nothing else does.
      - name: Cache XBRL taxonomy (Bolagsverket, pinned)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nonox-xbrl-taxonomy
          key: xbrl-taxonomy-${{ hashFiles('scripts/fetch-xbrl-taxonomy.sh') }}

      - name: Fetch XBRL taxonomy (pinned, SHA-256 verified)
        id: taxonomy
        run: echo "dir=$(scripts/fetch-xbrl-taxonomy.sh)" >> "$GITHUB_OUTPUT"

      - name: iXBRL annual report against the XBRL taxonomy
        env:
          BOLAGSVERKET_TAXONOMY_DIR: ${{ steps.taxonomy.outputs.dir }}
        run: vendor/bin/pest tests/Feature/AnnualReport/IxbrlAnnualReportTest.php

      - name: Pest
        env:
          BOLAGSVERKET_TAXONOMY_DIR: ${{ steps.taxonomy.outputs.dir }}
        run: vendor/bin/pest

  # ADR-058 stage E.3: full XBRL validation of the golden iXBRL files with Arelle (Apache-2.0).
  # Arelle runs only here, as an external tool; it is not a dependency of the app.
  # Blocking: any Arelle ERROR fails the job. The defects of the first run (empty class
  # attributes, lang on <html>, an empty signatures <tbody>) are fixed in the generator, and both
  # golden files validated with 0 errors and 0 warnings on 2026-11-06 (Arelle 2.47.4, taxonomy
  # 2026-08-31). Result format: one log per file (uploaded as the "arelle-logs" artifact), lines
  # "LEVEL [messageCode] message | file line".
  ixbrl-arelle:
    name: iXBRL validation (Arelle)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache XBRL taxonomy (Bolagsverket, pinned)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nonox-xbrl-taxonomy
          key: xbrl-taxonomy-${{ hashFiles('scripts/fetch-xbrl-taxonomy.sh') }}

      - name: Fetch XBRL taxonomy (pinned, SHA-256 verified)
        id: taxonomy
        run: echo "dir=$(scripts/fetch-xbrl-taxonomy.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Arelle (pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/arelle"
          "$RUNNER_TEMP/arelle/bin/pip" install --quiet arelle-release==2.47.4

      - name: Validate the golden iXBRL files with Arelle
        env:
          ARELLE_LOG_DIR: ${{ runner.temp }}/arelle-logs
        run: |
          export PATH="$RUNNER_TEMP/arelle/bin:$PATH"
          scripts/validate-ixbrl-arelle.sh "$(dirname "${{ steps.taxonomy.outputs.dir }}")/package.zip" tests/Fixtures/annual-report/*.xhtml

      - name: Upload Arelle logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arelle-logs
          path: ${{ runner.temp }}/arelle-logs
          if-no-files-found: ignore
