name: Release

# A version tag (v1.2.3) becomes a GitHub release with notes generated from
# the merged pull requests and commits since the previous tag. A tag with a
# suffix (v0.10.0-beta.1) is published as a pre-release. Every release
# carries a software bill of materials (SBOM, CycloneDX JSON) of the PHP and
# JavaScript packages in composer.lock and package-lock.json.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Software bill of materials
        uses: anchore/sbom-action@v0
        env:
          # Alpine, Chart.js and the rest are devDependencies because Vite
          # bundles them into the build; they still ship to every browser.
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
        with:
          path: .
          format: cyclonedx-json
          output-file: nonox-${{ github.ref_name }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* || "$TAG" == v0.* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" --title "NONOX $TAG" --generate-notes --verify-tag $prerelease "nonox-$TAG-sbom.cdx.json"
