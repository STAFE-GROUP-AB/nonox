x-oauth:
  description: 'OAuth 2.0 endpoints, outside /api/v1. Documented here for reference; they are not part of `paths`.'
  x-sv-description: 'OAuth-adresserna, utanför /api/v1.'
  authorization_endpoint:
    method: GET
    url: 'https://nonox.app/anslut'
    description: "Send the person's browser here. NONOX signs them in if needed, shows the Swedish consent screen, lets them choose a company where they are owner or administrator and approve with a passkey, then redirects to redirect_uri with `code` and `state` (or `error=access_denied`). Errors in client_id or redirect_uri are shown on the page, never redirected."
    query:
      response_type: 'Must be `code`.'
      client_id: "The app's client id (UUID)."
      redirect_uri: "Exactly one of the app's registered URIs."
      scope: 'Space-separated scopes.'
      state: 'Opaque value echoed back; use it against CSRF.'
      code_challenge: BASE64URL(SHA-256(code_verifier)).
      code_challenge_method: 'Must be `S256`.'
  token_endpoint:
    method: POST
    url: 'https://nonox.app/oauth/token'
    content_type: application/x-www-form-urlencoded
    description: 'grant_type=authorization_code (code, redirect_uri, code_verifier, client_id, client_secret for confidential clients) or grant_type=refresh_token (refresh_token, client_id, client_secret). Client authentication by client_secret_post or client_secret_basic; public clients send only client_id. Any other grant_type answers unsupported_grant_type. Errors follow RFC 6749 §5.2 (`error`, `error_description`). 30 requests/minute per IP.'
    response_example:
      token_type: Bearer
      expires_in: 900
      access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.…
      refresh_token: def50200…
  metadata:
    method: GET
    url: 'https://nonox.app/.well-known/oauth-authorization-server'
    description: 'RFC 8414 authorization server metadata.'
