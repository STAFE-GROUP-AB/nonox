                  - integer
                  - 'null'
    StockReceipt:
      type: object
      properties:
        id:
          type: integer
        number:
          type: integer
        status:
          type: string
          enum:
            - OPEN
            - PARTIAL
            - RECEIVED
            - CANCELLED
        supplier_id:
          type:
            - integer
            - 'null'
        supplier_invoice_id:
          type:
            - string
            - 'null'
        expected_on:
          type:
            - string
            - 'null'
        reference:
          type:
            - string
            - 'null'
        lines:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlanningArea:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        colour:
          type: string
          example: '#2e86ab'
        location_id:
          type:
            - integer
            - 'null'
          description: 'The staff-ledger location the area is tied to, if any.'
        sort:
          type: integer
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlanningPublication:
      type: object
      properties:
        id:
          type: integer
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        published_at:
          type: string
          format: date-time
        shift_count:
          type: integer
        notified_count:
          type: integer
          description: 'How many employees were sent their schedule.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookEvent:
      type: object
      required:
        - id
        - type
        - created_at
        - company_id
        - data
      properties:
        id:
          type: string
          format: uuid
          description: 'Same as the Nonox-Event-Id header; use it to ignore duplicates.'
        type:
          type: string
          enum:
            - voucher.posted
            - invoice.sent
            - invoice.paid
            - supplier_invoice.approved
            - planning.published
            - planning.attested
            - sie.uploaded
            - stock.changed
          description: 'Open enum: new event types may be added within v1.'
        created_at:
          type: string
          format: date-time
        company_id:
          type: integer
        data:
          type: object
      description: 'A webhook delivery body. Events are thin: ids, references, dates and amounts, never personal data; fetch the record through the API for more.'
x-oauth:
  description: 'OAuth 2.0 endpoints, outside /api/v1. Documented here for reference; they are not part of `paths`.'
  x-sv-description: 'OAuth-adresserna, utanför /api/v1.'
  authorization_endpoint:
    method: GET
    url: 'https://nonox.app/anslut'
    description: "Send the person's browser here. NONOX signs them in if needed, shows the Swedish consent screen, lets them choose a company where they are owner or administrator and approve with a passkey, then redirects to redirect_uri with `code` and `state` (or `error=access_denied`). Errors in client_id or redirect_uri are shown on the page, never redirected."
    query:
      response_type: 'Must be `code`.'
      client_id: "The app's client id (UUID)."
      redirect_uri: "Exactly one of the app's registered URIs."
      scope: 'Space-separated scopes.'
      state: 'Opaque value echoed back; use it against CSRF.'
      code_challenge: BASE64URL(SHA-256(code_verifier)).
      code_challenge_method: 'Must be `S256`.'
  token_endpoint:
    method: POST
    url: 'https://nonox.app/oauth/token'
    content_type: application/x-www-form-urlencoded
    description: 'grant_type=authorization_code (code, redirect_uri, code_verifier, client_id, client_secret for confidential clients) or grant_type=refresh_token (refresh_token, client_id, client_secret). Client authentication by client_secret_post or client_secret_basic; public clients send only client_id. Any other grant_type answers unsupported_grant_type. Errors follow RFC 6749 §5.2 (`error`, `error_description`). 30 requests/minute per IP.'
    response_example:
      token_type: Bearer
      expires_in: 900
      access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.…
      refresh_token: def50200…
  revocation_endpoint:
    method: POST
    url: 'https://nonox.app/oauth/revoke'
    content_type: application/x-www-form-urlencoded
    description: "RFC 7009. token (an access or refresh token), optional token_type_hint (access_token or refresh_token), and client authentication as at the token endpoint. A token of the app's own revokes the whole grant: every code and token, and the app must ask the person again. An unknown, expired or another app's token also answers 200 and changes nothing. Wrong client authentication answers 401 invalid_client; another hint 400 unsupported_token_type. 30 requests/minute per IP."
  metadata:
    method: GET
    url: 'https://nonox.app/.well-known/oauth-authorization-server'
    description: 'RFC 8414 authorization server metadata.'
