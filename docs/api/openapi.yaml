    post:
      operationId: createVoucher
      tags:
        - Verifikationer
      summary: 'Create a voucher draft'
      description: 'Creates a draft (status DRAFT, no number). Rows are validated as in the app: known active accounts, cost center/project when the account requires one, a row has either debit or credit. The fiscal year is chosen from voucher_date. Balance is checked when posting. Same Action as the app (SaveDraftVoucher).'
