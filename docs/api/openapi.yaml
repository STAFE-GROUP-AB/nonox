                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VatCode'
              examples:
                example:
                  value:
                    data:
                      - code: SALE_SE_25
                        name: 'Försäljning i Sverige, 25 % moms'
                        type: SALE_SE
                        rate_basis_points: 2500
                        vat_account: 2611
                        report_box: 10
                      - code: SALE_SE_12
                        name: 'Försäljning i Sverige, 12 % moms'
                        type: SALE_SE
                        rate_basis_points: 1200
                        vat_account: 2621
                        report_box: 11
                      - code: SALE_SE_6
                        name: 'Försäljning i Sverige, 6 % moms'
                        type: SALE_SE
                        rate_basis_points: 600
                        vat_account: 2631
                        report_box: 12
                      - code: PURCHASE_SE
                        name: 'Inköp i Sverige, avdragsgill ingående moms'
                        type: PURCHASE_SE
                        rate_basis_points: null
                        vat_account: 2641
                        report_box: 48
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /fiscal-years:
