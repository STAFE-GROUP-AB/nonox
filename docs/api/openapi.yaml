  /voucher-series:
    get:
      operationId: listVoucherSeries
      tags:
        - Bokföring
      summary: 'List voucher series'
      description: 'The voucher series (A Manuell, B Kundfakturor, …). Numbers are gapless per series and fiscal year. Not paginated.'
      x-sv-summary: 'Lista verifikationsserier'
      x-sv-description: 'Verifikationsserierna. Numren är obrutna per serie och räkenskapsår. Inte sidindelad.'
      security:
        - oauth2:
            - 'vouchers:view'
        - apiKey:
