      description: 'The company the credential is bound to, plus what the credential is (type, name, effective scopes on the credential). Needs no scope: every valid token or API key can read it. Use it to confirm which company a token belongs to.'
      x-sv-summary: 'Hämta företaget'
      x-sv-description: 'Företaget som nyckeln eller token är bunden till, och vilken nyckel eller app det är. Kräver ingen särskild behörighet.'
      security:
        - oauth2: []
        - apiKey: []
      x-required-scopes:
        anyOf: []
      responses:
        200:
          description: 'The company.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CompanyWithCredential'
              examples:
                example:
                  value:
                    data:
                      id: 42
                      name: 'Exempelbolaget AB'
                      legal_name: 'Exempelbolaget AB'
                      org_number: 556677-1233
                      legal_form: AB
                      vat_number: SE556677123301
                      vat_registered: true
                      vat_period: QUARTERLY
                      accounting_method: FAKTURAMETODEN
                      reporting_framework: K2
                      fiscal_year_start_month: 1
                      base_currency: SEK
                      locked_until_date: '2026-06-30'
                      archived: false
                      address:
                        line1: 'Exempelgatan 1'
                        line2: null
                        postal_code: '111 22'
                        city: Exempelstad
                        country: SE
                      credential:
                        type: oauth
                        name: Exempelappen
                        scopes:
                          - 'vouchers:view'
                          - 'vouchers:create'
                          - 'vouchers:post'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
