    get:
      operationId: listVatCodes
      tags:
        - Bokföring
      summary: 'List VAT codes'
      description: 'NONOX keeps VAT by account, not by a code table: a sale at 25 % books its VAT on 2611, which the VAT return reads into box 10. This list is derived from the same constants invoicing, supplier invoices and the VAT return use. Not paginated.'
      x-sv-summary: 'Lista momskoder'
      x-sv-description: 'NONOX håller moms per konto. Listan bygger på samma konton och rutor som fakturering och momsdeklarationen använder. Inte sidindelad.'
      security:
        - oauth2:
            - 'vouchers:view'
        - apiKey:
            - 'vouchers:view'
      x-required-scopes:
        anyOf:
          -
            - 'vouchers:view'
      responses:
        200:
          description: 'All VAT codes.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
