                        start_date: '2026-01-01'
                        end_date: '2026-12-31'
                        status: OPEN
                        updated_at: '2026-01-02T09:15:00+01:00'
                    meta:
                      limit: 50
                      next_cursor: null
                      has_more: false
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/fiscal-years/{fiscalYear}':
    get:
      operationId: getFiscalYear
      tags:
        - Bokföring
      summary: 'Get a fiscal year'
      description: 'One fiscal year by id.'
      x-sv-summary: 'Hämta ett räkenskapsår'
      x-sv-description: 'Ett räkenskapsår, utifrån id.'
      security:
        - oauth2:
            - 'vouchers:view'
        - apiKey:
            - 'vouchers:view'
      x-required-scopes:
        anyOf:
          -
            - 'vouchers:view'
      parameters:
