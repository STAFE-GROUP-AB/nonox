        429:
          $ref: '#/components/responses/TooManyRequests'
  /vouchers:
    get:
      operationId: listVouchers
      tags:
        - Verifikationer
      summary: 'List vouchers'
      description: 'Vouchers with their rows and attachment metadata, filtered by status, series, fiscal year and voucher date. Use updated_since to sync: posting a draft changes its updated_at, a posted voucher never changes again except that corrected_by_voucher_id is set once when it is corrected.'
      x-sv-summary: 'Lista verifikationer'
      x-sv-description: 'Verifikationer med rader och underlag. Filtrera på status, serie, räkenskapsår och datum. Synka med updated_since.'
      security:
        - oauth2:
            - 'vouchers:view'
        - apiKey:
            - 'vouchers:view'
      x-required-scopes:
        anyOf:
          -
            - 'vouchers:view'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/UpdatedSince'
        - name: status
          in: query
          required: false
          description: 'DRAFT or POSTED.'
          schema:
            type: string
            enum:
              - DRAFT
              - POSTED
        - name: series
          in: query
          required: false
          description: 'Series code, for example A.'
          schema:
            type: string
            maxLength: 3
        - name: fiscal_year_id
          in: query
          required: false
          description: 'Only vouchers in this fiscal year.'
          schema:
            type: integer
        - name: date_from
          in: query
          required: false
          description: 'Voucher date on or after (YYYY-MM-DD).'
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          description: 'Voucher date on or before (YYYY-MM-DD).'
          schema:
            type: string
            format: date
      responses:
        200:
          description: 'A page of vouchers.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Voucher'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
              examples:
                example:
                  value:
                    data:
                      - id: 0b9f3c1e-6a2d-4f7b-9c8e-1d2a3b4c5d6e
                        series: A
                        number: 57
                        reference: A57
                        status: POSTED
                        fiscal_year_id: 7
                        voucher_date: '2026-03-02'
                        description: Kontantförsäljning
                        source: MANUAL
                        corrects_voucher_id: null
                        corrected_by_voucher_id: null
                        posted_at: '2026-03-02T10:45:12+01:00'
                        hash: 3c1f0e9d8b7a6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d
                        currency: SEK
                        rows:
                          - account: 1930
                            debit_ore: 125000
                            credit_ore: 0
                            description: null
                            cost_center: null
                            project: null
                          - account: 3001
                            debit_ore: 0
                            credit_ore: 100000
                            description: null
                            cost_center: null
                            project: null
                          - account: 2611
                            debit_ore: 0
                            credit_ore: 25000
                            description: null
                            cost_center: null
                            project: null
                        attachments:
                          - id: 311
                            name: kvitto-kontorsmaterial.pdf
                            mime: application/pdf
                            size: 48213
                            sha256: 9f2b5c1d7e3a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                            created_at: '2026-03-02T10:41:07+01:00'
                        created_at: '2026-03-02T10:40:00+01:00'
                        updated_at: '2026-03-02T10:45:12+01:00'
                    meta:
                      limit: 50
                      next_cursor: eyJ1cGRhdGVkX2F0IjoiMjAyNi0wMy0wMiAxMDo0NToxMiIsImlkIjoiMGI5ZjNjMWUiLCJfcG9pbnRzVG9OZXh0SXRlbXMiOnRydWV9
                      has_more: true
        401:
