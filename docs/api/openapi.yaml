  voucher.posted:
    post:
      operationId: voucherPosted
      summary: 'A voucher was posted'
      x-sv-summary: 'En verifikation har bokförts'
      x-nonox-status: planned
      description: 'Sent as an HTTPS POST to each subscription for `voucher.posted`. Verify `Nonox-Signature` before trusting the body, reject timestamps older than five minutes, and answer 2xx quickly; failed deliveries are retried with backoff.'
      x-sv-description: 'Skickas med HTTPS POST till varje prenumeration på `voucher.posted`. Kontrollera Nonox-Signature innan du litar på innehållet.'
      parameters:
        - name: Nonox-Signature
          in: header
          required: true
          description: '`t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>" with the subscription secret>`. Compare in constant time.'
          schema:
            type: string
          example: 't=1772444713,v1=5f8e2a1c9b7d3e6f0a4c8b2d1e9f7a3c5b0d8e6f2a4c1b9d7e3f5a0c8b6d2e4f'
        - name: Nonox-Event-Id
          in: header
          required: true
          description: 'Unique per event; the same on every retry.'
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
            examples:
              example:
