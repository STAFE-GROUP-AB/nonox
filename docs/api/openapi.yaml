  /planning/shifts:
    get:
      operationId: listPlanningShifts
      tags:
        - Planering
      summary: 'List the schedule for a period'
      description: "The shifts of the schedule (Planering) starting on the days from–to, at most 93 days, oldest first. By default the published schedule: what the employees were shown, so a shift changed since it was published is given as it was published (`has_unpublished_changes` is true) and a draft never published is left out. With `include_drafts=true` the plan as it stands now. Cancelled shifts are never listed. Times are ISO 8601 with the offset of Europe/Stockholm. Labour cost estimates are not part of the API. Needs planning:view, which no one has while the module is off."
      x-sv-summary: 'Lista schemat för en period'
      x-sv-description: 'Passen i schemat som börjar dag från–till, högst 93 dagar. Som standard det publicerade schemat, så som de anställda fick se det; med include_drafts=true planen som den ser ut nu. Inställda pass visas aldrig, och kostnadsuppskattningar ingår inte.'
      security:
        - oauth2:
            - 'planning:view'
        - apiKey:
            - 'planning:view'
      x-required-scopes:
        anyOf:
          -
            - 'planning:view'
      parameters:
        - name: from
          in: query
          required: true
          description: 'First day, YYYY-MM-DD.'
          schema:
            type: string
            format: date
          example: '2026-11-09'
        - name: to
          in: query
          required: true
          description: 'Last day, YYYY-MM-DD; at most 93 days after from, counting both.'
          schema:
            type: string
            format: date
          example: '2026-11-15'
        - name: employee_id
          in: query
          required: false
          description: "Only this employee's shifts."
          schema:
            type: integer
        - name: area_id
          in: query
          required: false
          description: 'Only shifts in this area (avdelning).'
          schema:
            type: integer
        - name: include_drafts
          in: query
          required: false
          description: 'true for the plan as it stands now, drafts included; false (default) for the published schedule.'
          schema:
            type: boolean
      responses:
        200:
          description: 'The shifts of the period.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanningShift'
                  meta:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                      include_drafts:
                        type: boolean
                      count:
                        type: integer
              examples:
                example:
                  value:
                    data:
                      - id: 9b1e2c4d-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                        day: '2026-11-10'
                        employee_id: 7
                        employee_name: 'Anna Kock'
                        area_id: 2
                        skill_id: null
                        starts_at: '2026-11-10T08:00:00+01:00'
                        ends_at: '2026-11-10T16:00:00+01:00'
                        break_minutes: 30
                        worked_minutes: 450
                        note: null
                        is_open: false
                        status: published
                        has_unpublished_changes: false
                        published_at: '2026-11-04T10:00:00+01:00'
                    meta:
                      from: '2026-11-09'
                      to: '2026-11-15'
                      include_drafts: false
                      count: 1
