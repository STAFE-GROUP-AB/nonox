                      - number: 1930
                        name: Företagskonto
                        type: ASSET
                        is_active: true
                        sru_code: '7281'
                        requires_cost_center: false
                        requires_project: false
                        updated_at: '2026-01-02T09:15:00+01:00'
                      - number: 3001
                        name: 'Försäljning varor 25 % moms'
                        type: REVENUE
                        is_active: true
                        sru_code: '7410'
                        requires_cost_center: false
                        requires_project: false
                        updated_at: '2026-01-02T09:15:00+01:00'
                    meta:
