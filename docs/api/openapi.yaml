      operationId: listFiscalYears
      tags:
        - Bokföring
      summary: 'List fiscal years'
      description: "The company's fiscal years (räkenskapsår), open and closed."
      x-sv-summary: 'Lista räkenskapsår'
      x-sv-description: 'Företagets räkenskapsår, öppna och stängda.'
      security:
