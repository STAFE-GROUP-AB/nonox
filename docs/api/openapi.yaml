  /reports/trial-balance:
    get:
      operationId: getTrialBalance
      tags:
        - Rapporter
      summary: 'Trial balance (saldobalans)'
      description: 'Opening balance, debit, credit and closing balance per account for the period. Debit is positive. Only posted vouchers count. Same calculation as the reports page (LedgerReports).'
      x-sv-summary: Saldobalans
      x-sv-description: 'Ingående saldo, debet, kredit och utgående saldo per konto.'
      security:
        - oauth2:
            - 'reports:view'
        - apiKey:
            - 'reports:view'
      x-required-scopes:
        anyOf:
          -
            - 'reports:view'
      parameters:
        - name: fiscal_year_id
          in: query
          required: true
          description: "The fiscal year's id. Another company's id answers 404."
          schema:
            type: integer
        - name: from
          in: query
          required: false
          description: 'Start of the period inside the fiscal year (default: its first day).'
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 'End of the period inside the fiscal year (default: its last day).'
          schema:
            type: string
            format: date
        - name: cost_center
          in: query
          required: false
          description: 'Only rows for this cost centre code.'
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: 'Only rows for this project code.'
          schema:
            type: string
      responses:
        200:
          description: 'The report.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/TrialBalance'
              examples:
                example:
                  value:
                    data:
                      fiscal_year_id: 7
                      from: '2026-01-01'
                      to: '2026-12-31'
