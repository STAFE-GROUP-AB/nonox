components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'Authorization code with PKCE (S256 required). Access tokens ≤ 15 minutes; refresh tokens rotate and reuse revokes the grant.'
      flows:
        authorizationCode:
          authorizationUrl: 'https://nonox.app/anslut'
          tokenUrl: 'https://nonox.app/oauth/token'
          refreshUrl: 'https://nonox.app/oauth/token'
          scopes:
            'vouchers:view': 'Read vouchers, attachments, chart of accounts, fiscal years, voucher series and VAT codes'
            'vouchers:create': 'Create and change voucher drafts and add attachments'
            'vouchers:post': 'Post vouchers (irreversible; only a correction can undo the effect)'
            'vouchers:correct': 'Correct posted vouchers with a correcting voucher'
            'invoices:view': 'Read the customer register'
            'invoices:create': 'Create and change customers'
            'supplier-invoices:create': 'Read, create and change suppliers'
            'supplier-invoices:approve': 'Read the supplier register'
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: nnx_…
      description: 'An API key created under Anslutningar, sent as `Authorization: Bearer nnx_…`. Its scopes are chosen when it is created.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Required on every POST. A unique value per intended operation (a UUID v4 is ideal), 1–255 visible ASCII characters. Kept 24 hours per credential: the same key with the same request returns the stored response (Idempotent-Replayed: true); with a different request 422 idempotency_key_reused; while the first is still running 409. Server errors (5xx) are not stored, so retry with the same key.'
      x-sv-description: 'Krävs på varje POST. Ett unikt värde per avsedd åtgärd (helst ett UUID). Sparas i 24 timmar per nyckel eller app, så att ett nytt försök aldrig bokför två gånger.'
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 3f6c1b7e-2d4a-4e8b-9c0d-5a1b2c3d4e5f
    Limit:
      name: limit
      in: query
      required: false
      description: 'Page size, 1–200.'
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: 'Opaque cursor from meta.next_cursor of the previous page.'
      schema:
        type: string
        maxLength: 2000
    UpdatedSince:
      name: updated_since
      in: query
      required: false
      description: 'Only records whose updated_at is strictly later than this ISO 8601 time. Lists are ordered by updated_at, then id, so a sync stores the updated_at of the last record it has seen and passes it next time, walking all pages with `cursor`.'
      x-sv-description: 'Bara poster som ändrats efter den här tiden (ISO 8601). Listor sorteras på updated_at och id.'
      schema:
        type: string
        format: date-time
      example: '2026-03-01T00:00:00+01:00'
    VoucherId:
      name: voucher
      in: path
      required: true
      description: 'Voucher id (UUID).'
      schema:
        type: string
        format: uuid
      example: 0b9f3c1e-6a2d-4f7b-9c8e-1d2a3b4c5d6e
  headers:
    XRequestId:
      description: "Unique id of this request; also in a problem's `instance`."
      schema:
        type: string
        format: uuid
    RateLimitLimit:
      description: 'Requests allowed per minute for this credential.'
      schema:
        type: integer
      example: 120
    RateLimitRemaining:
      description: 'Requests left in the current minute for this credential.'
      schema:
        type: integer
      example: 117
    RateLimitReset:
      description: 'Seconds until the window resets.'
      schema:
        type: integer
      example: 42
    RetryAfter:
      description: 'Seconds to wait before retrying.'
      schema:
        type: integer
      example: 23
    IdempotentReplayed:
      description: '`true` when this is the stored response of an earlier request with the same Idempotency-Key (nothing was done again).'
      schema:
        type: string
        enum:
          - 'true'
    Location:
      description: 'URL of the created resource.'
      schema:
        type: string
        format: uri
    ContentSha256:
      description: 'SHA-256 of the file, hex.'
      schema:
        type: string
    WwwAuthenticate:
      description: 'Bearer realm="nonox", error="invalid_token"'
      schema:
        type: string
  responses:
    BadRequest:
      description: 'Bad request: missing or invalid Idempotency-Key, or a body that is not a JSON object.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            idempotency_key_required:
              summary: 'No Idempotency-Key on a POST'
              value:
                type: 'urn:nonox:problem:idempotency_key_required'
                title: 'Bad Request'
                status: 400
                code: idempotency_key_required
                detail: 'Skicka en unik Idempotency-Key (till exempel ett UUID) med varje POST, så att ett nytt försök aldrig bokför två gånger.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
            idempotency_key_invalid:
              summary: 'Idempotency-Key too long or not visible ASCII'
              value:
                type: 'urn:nonox:problem:idempotency_key_invalid'
                title: 'Bad Request'
                status: 400
                code: idempotency_key_invalid
                detail: 'Idempotency-Key ska vara 1–255 synliga ASCII-tecken.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
            invalid_json:
              summary: 'Malformed JSON'
              value:
                type: 'urn:nonox:problem:invalid_json'
                title: 'Bad Request'
                status: 400
                code: invalid_json
                detail: 'Kroppen är inte giltig JSON (ett objekt).'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
    Unauthorized:
      description: 'Missing, invalid, expired or revoked token or API key. Also returned when the person behind the credential has left the company (an OAuth grant is then revoked for good).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unauthenticated:
              summary: 'No valid credential'
              value:
                type: 'urn:nonox:problem:unauthenticated'
                title: Unauthorized
                status: 401
                code: unauthenticated
                detail: 'Nyckeln eller token saknas, är ogiltig, har gått ut eller har återkallats.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
    Forbidden:
      description: 'The credential may not do this: a scope is missing, the granting person no longer has the permission, the address is not allowed, the company is archived (read-only) or no longer allows the app.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            insufficient_scope:
              summary: 'Scope missing or permission lost'
              value:
                type: 'urn:nonox:problem:insufficient_scope'
                title: Forbidden
                status: 403
                code: insufficient_scope
                detail: 'Nyckeln eller appen saknar behörigheten vouchers:post, eller så har personen som gav den inte längre den behörigheten i företaget.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
                required_scopes:
                  - 'vouchers:post'
            forbidden:
              summary: 'The action refuses (for example changing a posted voucher)'
              value:
                type: 'urn:nonox:problem:forbidden'
                title: Forbidden
                status: 403
                code: forbidden
                detail: 'Behörighet saknas för det här.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
            ip_not_allowed:
              summary: 'Outside the IP allowlist'
              value:
                type: 'urn:nonox:problem:ip_not_allowed'
                title: Forbidden
                status: 403
                code: ip_not_allowed
                detail: 'Företaget tillåter inte anrop från den här adressen.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
            company_archived:
              summary: 'Write to an archived company'
              value:
                type: 'urn:nonox:problem:company_archived'
                title: Forbidden
                status: 403
                code: company_archived
                detail: 'Företaget är arkiverat och kan bara läsas.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
            app_not_allowed:
              summary: 'The company no longer allows the app'
              value:
                type: 'urn:nonox:problem:app_not_allowed'
                title: Forbidden
                status: 403
                code: app_not_allowed
                detail: 'Företaget tillåter inte längre den här appen.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
    NotFound:
      description: "Not found. Also the answer for another company's ids (existence is never revealed) and for every call while NONOX Connect is turned off for the company."
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            not_found:
              summary: "Unknown id, other company's id, or module off"
              value:
                type: 'urn:nonox:problem:not_found'
                title: 'Not Found'
                status: 404
                code: not_found
                detail: 'Det du söker finns inte.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
    Conflict:
      description: 'A request with the same Idempotency-Key is still running.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            idempotency_in_progress:
              summary: 'Same key, first request not finished'
              value:
                type: 'urn:nonox:problem:idempotency_in_progress'
                title: Conflict
                status: 409
                code: idempotency_in_progress
                detail: 'En begäran med samma Idempotency-Key pågår. Vänta och försök igen.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
    UnsupportedMediaType:
      description: 'The body is not application/json (or multipart/form-data where a file is accepted).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unsupported_media_type:
              summary: 'Wrong Content-Type'
              value:
                type: 'urn:nonox:problem:unsupported_media_type'
                title: 'Unsupported Media Type'
                status: 415
                code: unsupported_media_type
                detail: 'Skicka JSON (application/json).'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
    Unprocessable:
      description: 'Validation failed, or the Idempotency-Key was already used for a different request.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            validation_failed:
              summary: 'Field errors'
              value:
                type: 'urn:nonox:problem:validation_failed'
                title: 'Unprocessable Content'
                status: 422
                code: validation_failed
                detail: 'Uppgifterna kunde inte godtas. Se errors.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
                errors:
                  rows:
                    - 'Verifikationen balanserar inte: debet och kredit skiljer sig åt.'
                  voucher_date:
                    - 'Det finns inget räkenskapsår som omfattar 2031-01-01.'
            idempotency_key_reused:
              summary: 'Same key, different body'
              value:
                type: 'urn:nonox:problem:idempotency_key_reused'
                title: 'Unprocessable Content'
                status: 422
                code: idempotency_key_reused
                detail: 'Idempotency-Key har redan använts för en annan begäran. Använd en ny nyckel för en ny begäran.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
    TooManyRequests:
      description: 'Rate limit exceeded (per credential, per company or per address). Wait Retry-After seconds.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            rate_limited:
              summary: 'Over the limit'
              value:
                type: 'urn:nonox:problem:rate_limited'
                title: 'Too Many Requests'
                status: 429
                code: rate_limited
                detail: 'För många anrop. Försök igen om 23 sekunder.'
                instance: 'urn:nonox:request:7f3c2a9e-4b1d-4c8e-9a51-2d6f0e8b3c17'
  schemas:
    ProblemDetails:
      type: object
      description: 'RFC 9457 problem details. `detail` is Swedish, for people; branch on `code` (or `type`), never on `detail`.'
      required:
        - type
        - title
        - status
        - code
        - detail
      properties:
        type:
          type: string
          format: uri
          description: 'urn:nonox:problem:<code>'
          example: 'urn:nonox:problem:not_found'
        title:
          type: string
          description: 'Short English HTTP title.'
        status:
          type: integer
        code:
          type: string
          description: 'Stable machine-readable code.'
        detail:
          type: string
          description: 'Swedish explanation.'
        instance:
          type: string
          description: 'urn:nonox:request:<uuid>, the same id as X-Request-Id; quote it in support questions.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Validation errors per field (422 validation_failed).'
        required_scopes:
          type: array
          items:
            type: string
          description: 'Scopes the route needs (403 insufficient_scope).'
    ListMeta:
      type: object
      required:
        - limit
        - next_cursor
        - has_more
      properties:
        limit:
          type: integer
        next_cursor:
          type:
            - string
            - 'null'
          description: 'Opaque; pass as `cursor` for the next page. null on the last page.'
        has_more:
          type: boolean
    Credential:
      type: object
      properties:
        type:
          type: string
          enum:
            - oauth
            - api_key
        name:
          type: string
          description: 'App name or API key name.'
        scopes:
          type: array
          items:
            type: string
    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        legal_name:
          type:
            - string
            - 'null'
        org_number:
          type:
            - string
            - 'null'
        legal_form:
          type:
            - string
            - 'null'
          enum:
            - AB
            - EF
            - HB
            - KB
            - EK_FORENING
            - IDEELL_FORENING
            - STIFTELSE
            - null
        vat_number:
          type:
            - string
            - 'null'
        vat_registered:
          type: boolean
