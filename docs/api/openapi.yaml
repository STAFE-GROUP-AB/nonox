    x-sv-description: 'Företaget som nyckeln eller appen gäller.'
  - name: Bokföring
    description: 'Reference data for bookkeeping: chart of accounts, VAT codes, fiscal years and voucher series.'
    x-sv-description: 'Kontoplan, momskoder, räkenskapsår och verifikationsserier.'
  - name: Verifikationer
    description: 'Vouchers: drafts, posting, corrections and attachments (underlag). A posted voucher is immutable.'
    x-sv-description: 'Verifikationer: utkast, bokföring, rättelser och underlag. En bokförd verifikation kan aldrig ändras.'
  - name: Kunder
    description: 'The customer register.'
    x-sv-description: Kundregistret.
  - name: Leverantörer
    description: 'The supplier register.'
    x-sv-description: Leverantörsregistret.
security:
  - oauth2: []
  - apiKey: []
