# NONOX Connect API v1 (ADR-032): the single source of truth for the API and
# its developer site. tests/Feature/Connect/OpenApiSpecTest.php fails when a
# route under /api/v1 is missing here. All example data is synthetic.
openapi: 3.1.0
info:
  title: 'NONOX Connect API'
  version: 1.0.0
  description: |-
    The public API of NONOX Ekonomisystem, an open-source Swedish bookkeeping system.

    **Authentication.** Apps use OAuth 2.0 authorization code with PKCE (S256 is required for every client; implicit, password, client credentials and device grants do not exist). An owner or administrator approves the app on the Swedish consent screen with a passkey and chooses one company. Access tokens live at most 15 minutes; refresh tokens rotate on every use, and a refresh token (or authorization code) used twice revokes the whole grant. Scripts use API keys (`nnx_…`) created under Anslutningar: one company, chosen scopes, mandatory expiry, optional IP allowlist, shown once and stored hashed. Send either as `Authorization: Bearer …`; cookies are never accepted.

    **One company per credential.** Every token and key belongs to exactly one company. Another company's ids answer 404. While NONOX Connect is turned off for the company, every call answers 404. An archived company can only be read.

    **Effective rights.** A request may do what its scopes allow AND what the person who granted the app or created the key may do in the company right now, evaluated on every request. A changed role reduces access at once; a person who leaves the company takes the credential's access with them.

    **Rate limits.** Per credential 120 requests/minute, per company 600/minute, and 600/minute per IP address before authentication (operators can change these). Every response carries RateLimit-Limit, RateLimit-Remaining and RateLimit-Reset; 429 adds Retry-After.

    **Idempotency.** Every POST requires an Idempotency-Key, kept 24 hours per credential.

    **Errors** are RFC 9457 `application/problem+json` with a stable `code` and a Swedish `detail`.

    **Money** is integer öre (1 SEK = 100 öre) in fields ending in `_ore`. Dates are ISO 8601.

    **Versioning.** The version is in the path (`/v1`). Within v1 changes are additive only (new endpoints, new optional fields, new enum values in responses); anything breaking gets `/v2`, with v1 kept alongside.

    **Webhooks** are described under `webhooks` but are not delivered yet (`x-nonox-status: planned`).
  x-sv-description: 'Det öppna API:t för NONOX Ekonomisystem. Appar ansluts med OAuth 2.0 (auktoriseringskod med PKCE S256) och godkänns av en ägare eller administratör med passkey; skript använder API-nycklar som skapas under Anslutningar. Varje nyckel eller app gäller ett företag och får aldrig mer än sina behörigheter och vad personen som gav den får göra just nu. Fel kommer som problem+json med svensk förklaring. Varje POST kräver Idempotency-Key. Belopp anges i öre. Webhooks är beskrivna men skickas inte ännu.'
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: NONOX
    url: 'https://github.com/STAFE-GROUP-AB/nonox'
