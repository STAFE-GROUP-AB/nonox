# NONOX Connect API v1 (ADR-032): the single source of truth for the API and
# its developer site. tests/Feature/Connect/OpenApiSpecTest.php fails when a
# route under /api/v1 is missing here. All example data is synthetic.
openapi: 3.1.0
info:
  title: 'NONOX Connect API'
  version: 1.4.0
  description: |-
    The public API of NONOX Ekonomisystem, an open-source Swedish bookkeeping system.

    **Authentication.** Apps use OAuth 2.0 authorization code with PKCE (S256 is required for every client; implicit, password, client credentials and device grants do not exist). An owner or administrator approves the app on the Swedish consent screen with a passkey and chooses one company. Access tokens live at most 15 minutes; refresh tokens rotate on every use, and a refresh token (or authorization code) used twice revokes the whole grant. Scripts use API keys (`nnx_…`) created under Anslutningar: one company, chosen scopes, mandatory expiry, optional IP allowlist, shown once and stored hashed. Send either as `Authorization: Bearer …`; cookies are never accepted.

    **One company per credential.** Every token and key belongs to exactly one company. Another company's ids answer 404. While NONOX Connect is turned off for the company, every call answers 404. An archived company can only be read.

    **Effective rights.** A request may do what its scopes allow AND what the person who granted the app or created the key may do in the company right now, evaluated on every request. A changed role reduces access at once; a person who leaves the company takes the credential's access with them.

    **Rate limits.** Per credential 120 requests/minute, per company 600/minute, and 600/minute per IP address before authentication (operators can change these). Every response carries RateLimit-Limit, RateLimit-Remaining and RateLimit-Reset; 429 adds Retry-After.

    **Idempotency.** Every POST requires an Idempotency-Key, kept 24 hours per credential.

    **Errors** are RFC 9457 `application/problem+json` with a stable `code` and a Swedish `detail`.

    **Money** is integer öre (1 SEK = 100 öre) in fields ending in `_ore`. Dates are ISO 8601.

    **Versioning.** The version is in the path (`/v1`). Within v1 changes are additive only (new endpoints, new optional fields, new enum values in responses); anything breaking gets `/v2`, with v1 kept alongside.

    **Webhooks** (described under `webhooks`) are set up under Anslutningar by an owner or administrator with a passkey: an https address on the internet, chosen events and a signing secret shown once. Deliveries carry `Nonox-Signature: t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<body>">` and `Nonox-Event-Id`, are sent after the change has committed, and are retried for about a day. Addresses that resolve to private, loopback, link-local, CGNAT or multicast networks are refused.

    **Booking routes.** Issuing an invoice, registering a supplier invoice and registering a payment post a voucher as the person behind the credential, so they need vouchers:create and vouchers:post as well (`x-required-scopes`).

    **Revocation.** An app revokes its own grant with `POST /oauth/revoke` (RFC 7009).

    **Test companies.** An operator (`php artisan connect:test-company <email>`) or an owner under Anslutningar can create a clearly marked test company with demo data to try the API against. It never e-mails documents.
  x-sv-description: 'Det öppna API:t för NONOX Ekonomisystem. Appar ansluts med OAuth 2.0 (auktoriseringskod med PKCE S256) och godkänns av en ägare eller administratör med passkey; skript använder API-nycklar som skapas under Anslutningar. Varje nyckel eller app gäller ett företag och får aldrig mer än sina behörigheter och vad personen som gav den får göra just nu. Fel kommer som problem+json med svensk förklaring. Varje POST kräver Idempotency-Key. Belopp anges i öre. Webhooks signeras med HMAC-SHA256 och skickas efter att ändringen har sparats. Testföretag med exempeldata finns för att prova API:t.'
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: NONOX
    url: 'https://github.com/STAFE-GROUP-AB/nonox'
servers:
  - url: 'https://nonox.app/api/v1'
    description: 'NONOX (hosted)'
  - url: 'https://{host}/api/v1'
    description: 'A self-hosted NONOX'
    variables:
      host:
        default: nonox.example.se
        description: "Your installation's host name."
tags:
  - name: Företaget
    x-en-name: Company
    description: 'The company the credential belongs to.'
    x-sv-description: 'Företaget som nyckeln eller appen gäller.'
  - name: Bokföring
    x-en-name: Bookkeeping
    description: 'Reference data for bookkeeping: chart of accounts, VAT codes, fiscal years and voucher series.'
    x-sv-description: 'Kontoplan, momskoder, räkenskapsår och verifikationsserier.'
  - name: Verifikationer
    x-en-name: Vouchers
    description: 'Vouchers: drafts, posting, corrections and attachments (underlag). A posted voucher is immutable.'
    x-sv-description: 'Verifikationer: utkast, bokföring, rättelser och underlag. En bokförd verifikation kan aldrig ändras.'
  - name: Kunder
    x-en-name: Customers
    description: 'The customer register.'
    x-sv-description: Kundregistret.
  - name: Leverantörer
    x-en-name: Suppliers
    description: 'The supplier register.'
    x-sv-description: Leverantörsregistret.
  - name: 'Kostnadsställen och projekt'
    x-en-name: Cost centres and projects
    description: 'Cost centres (SIE dimension 1) and projects (dimension 6).'
    x-sv-description: 'Kostnadsställen och projekt.'
  - name: Rapporter
    x-en-name: Reports
    description: 'Trial balance, general ledger, balance sheet and income statement as JSON.'
    x-sv-description: 'Saldobalans, huvudbok, balansrapport och resultatrapport.'
  - name: Moms
    x-en-name: VAT
    description: 'VAT periods and the VAT return per period (read-only).'
    x-sv-description: 'Momsperioder och momsdeklaration.'
  - name: Artiklar
    x-en-name: Articles
    description: 'The article register.'
    x-sv-description: Artikelregistret.
  - name: Kundfakturor
    x-en-name: Customer invoices
    description: 'Customer invoices: drafts, issuing, e-mail, credit, payments and PDF. An issued invoice never changes.'
    x-sv-description: 'Kundfakturor: utkast, skapa, mejla, kreditera, betalningar och PDF.'
  - name: Leverantörsfakturor
    x-en-name: Supplier invoices
    description: 'Supplier invoices: drafts, file, registering, approval with segregation of duties and payment.'
    x-sv-description: 'Leverantörsfakturor: utkast, fil, registrering, attest och betalning.'
  - name: Betalningar
    x-en-name: Payments
    description: 'Incoming and outgoing payments, read-only.'
    x-sv-description: 'In- och utbetalningar.'
  - name: Planering
    x-en-name: Scheduling
    description: 'The staff schedule (Planering), read-only: shifts per period, areas and publications. Needs the Planering module.'
    x-sv-description: 'Personalschemat i Planering: pass per period, avdelningar och publiceringar.'
  - name: Lager
    x-en-name: Inventory
    description: 'Stock in Lager: stocked articles with stock per location, locations, stock levels, and goods receipts. Needs the Lager module.'
    x-sv-description: 'Lagret: lagerförda artiklar med saldo per plats, lagerställen, saldon och inleveranser.'
security:
  - oauth2: []
  - apiKey: []
paths:
  /company:
    get:
      operationId: getCompany
      tags:
        - Företaget
      summary: 'Get the company'
      description: 'The company the credential is bound to, plus what the credential is (type, name, effective scopes on the credential). Needs no scope: every valid token or API key can read it. Use it to confirm which company a token belongs to.'
      x-sv-summary: 'Hämta företaget'
      x-sv-description: 'Företaget som nyckeln eller token är bunden till, och vilken nyckel eller app det är. Kräver ingen särskild behörighet.'
      security:
        - oauth2: []
        - apiKey: []
      x-required-scopes:
        anyOf: []
      responses:
        200:
          description: 'The company.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CompanyWithCredential'
              examples:
                example:
                  value:
                    data:
                      id: 42
                      name: 'Exempelbolaget AB'
                      legal_name: 'Exempelbolaget AB'
                      org_number: 556677-1233
                      legal_form: AB
                      vat_number: SE556677123301
                      vat_registered: true
                      vat_period: QUARTERLY
                      accounting_method: FAKTURAMETODEN
                      reporting_framework: K2
                      fiscal_year_start_month: 1
                      base_currency: SEK
                      locked_until_date: '2026-06-30'
                      archived: false
                      address:
                        line1: 'Exempelgatan 1'
                        line2: null
                        postal_code: '111 22'
                        city: Exempelstad
                        country: SE
                      credential:
                        type: oauth
                        name: Exempelappen
                        scopes:
                          - 'vouchers:view'
                          - 'vouchers:create'
                          - 'vouchers:post'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /accounts:
    get:
      operationId: listAccounts
      tags:
        - Bokföring
      summary: 'List the chart of accounts'
      description: "The company's accounts (BAS numbering, 1000–9999), ordered by updated_at then number's row id. Filter on is_active. Supports updated_since for sync."
      x-sv-summary: 'Lista kontoplanen'
      x-sv-description: 'Företagets konton enligt BAS. Kan filtreras på aktiva konton och synkas med updated_since.'
      security:
        - oauth2:
            - 'vouchers:view'
        - apiKey:
            - 'vouchers:view'
      x-required-scopes:
        anyOf:
          -
            - 'vouchers:view'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/UpdatedSince'
        - name: is_active
          in: query
          required: false
          description: 'Only active (true) or inactive (false) records.'
          schema:
            type: boolean
      responses:
        200:
          description: 'A page of accounts.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
              examples:
                example:
                  value:
                    data:
                      - number: 1930
                        name: Företagskonto
                        type: ASSET
                        is_active: true
                        sru_code: '7281'
                        requires_cost_center: false
                        requires_project: false
                        updated_at: '2026-01-02T09:15:00+01:00'
                      - number: 3001
                        name: 'Försäljning varor 25 % moms'
                        type: REVENUE
                        is_active: true
                        sru_code: '7410'
                        requires_cost_center: false
                        requires_project: false
                        updated_at: '2026-01-02T09:15:00+01:00'
                    meta:
                      limit: 50
                      next_cursor: eyJ1cGRhdGVkX2F0IjoiMjAyNi0wMy0wMiAxMDo0NToxMiIsImlkIjoiMGI5ZjNjMWUiLCJfcG9pbnRzVG9OZXh0SXRlbXMiOnRydWV9
                      has_more: true
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/accounts/{number}':
    get:
      operationId: getAccount
      tags:
        - Bokföring
      summary: 'Get an account'
      description: 'One account by its account number.'
      x-sv-summary: 'Hämta ett konto'
      x-sv-description: 'Ett konto, utifrån kontonumret.'
      security:
        - oauth2:
            - 'vouchers:view'
        - apiKey:
            - 'vouchers:view'
      x-required-scopes:
        anyOf:
          -
            - 'vouchers:view'
      parameters:
        - name: number
          in: path
          required: true
          description: 'Account number, 1000–9999.'
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
          example: 1930
      responses:
        200:
          description: 'The account.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
              examples:
                example:
                  value:
                    data:
                      number: 1930
                      name: Företagskonto
                      type: ASSET
                      is_active: true
                      sru_code: '7281'
                      requires_cost_center: false
                      requires_project: false
                      updated_at: '2026-01-02T09:15:00+01:00'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /vat-codes:
    get:
      operationId: listVatCodes
      tags:
        - Bokföring
      summary: 'List VAT codes'
      description: 'NONOX keeps VAT by account, not by a code table: a sale at 25 % books its VAT on 2611, which the VAT return reads into box 10. This list is derived from the same constants invoicing, supplier invoices and the VAT return use. Not paginated.'
      x-sv-summary: 'Lista momskoder'
      x-sv-description: 'NONOX håller moms per konto. Listan bygger på samma konton och rutor som fakturering och momsdeklarationen använder. Inte sidindelad.'
      security:
        - oauth2:
            - 'vouchers:view'
        - apiKey:
            - 'vouchers:view'
      x-required-scopes:
        anyOf:
          -
            - 'vouchers:view'
      responses:
        200:
          description: 'All VAT codes.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VatCode'
              examples:
                example:
                  value:
                    data:
                      - code: SALE_SE_25
                        name: 'Försäljning i Sverige, 25 % moms'
                        type: SALE_SE
                        rate_basis_points: 2500
                        vat_account: 2611
                        report_box: 10
                      - code: SALE_SE_12
                        name: 'Försäljning i Sverige, 12 % moms'
                        type: SALE_SE
                        rate_basis_points: 1200
                        vat_account: 2621
                        report_box: 11
                      - code: SALE_SE_6
                        name: 'Försäljning i Sverige, 6 % moms'
                        type: SALE_SE
                        rate_basis_points: 600
                        vat_account: 2631
                        report_box: 12
                      - code: PURCHASE_SE
                        name: 'Inköp i Sverige, avdragsgill ingående moms'
                        type: PURCHASE_SE
                        rate_basis_points: null
                        vat_account: 2641
                        report_box: 48
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /fiscal-years:
    get:
      operationId: listFiscalYears
      tags:
        - Bokföring
      summary: 'List fiscal years'
      description: "The company's fiscal years (räkenskapsår), open and closed."
      x-sv-summary: 'Lista räkenskapsår'
      x-sv-description: 'Företagets räkenskapsår, öppna och stängda.'
      security:
        - oauth2:
            - 'vouchers:view'
        - apiKey:
            - 'vouchers:view'
      x-required-scopes:
        anyOf:
          -
            - 'vouchers:view'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        200:
          description: 'A page of fiscal years.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FiscalYear'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
              examples:
                example:
                  value:
                    data:
                      - id: 7
                        start_date: '2026-01-01'
                        end_date: '2026-12-31'
                        status: OPEN
                        updated_at: '2026-01-02T09:15:00+01:00'
                    meta:
                      limit: 50
                      next_cursor: null
                      has_more: false
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/fiscal-years/{fiscalYear}':
    get:
      operationId: getFiscalYear
      tags:
        - Bokföring
      summary: 'Get a fiscal year'
      description: 'One fiscal year by id.'
      x-sv-summary: 'Hämta ett räkenskapsår'
      x-sv-description: 'Ett räkenskapsår, utifrån id.'
      security:
        - oauth2:
            - 'vouchers:view'
        - apiKey:
            - 'vouchers:view'
      x-required-scopes:
        anyOf:
          -
            - 'vouchers:view'
      parameters:
        - name: fiscalYear
          in: path
          required: true
          description: 'Fiscal year id.'
          schema:
            type: integer
          example: 7
      responses:
        200:
          description: 'The fiscal year.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/FiscalYear'
              examples:
                example:
                  value:
                    data:
                      id: 7
                      start_date: '2026-01-01'
                      end_date: '2026-12-31'
                      status: OPEN
                      updated_at: '2026-01-02T09:15:00+01:00'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/fiscal-years/{fiscalYear}/periods':
    parameters:
      - name: fiscalYear
        in: path
        required: true
        description: 'Fiscal year id.'
        schema:
          type: integer
        example: 7
    get:
      operationId: listFiscalYearPeriods
      tags:
        - Bokföring
      summary: 'List the months of a fiscal year and their lock status'
      description: "The fiscal year's months and whether each is locked by the company's lock date (nothing can be posted on or before locked_until_date)."
      x-sv-summary: 'Räkenskapsårets perioder och låsning'
      x-sv-description: 'Räkenskapsårets månader och om de är låsta för bokföring.'
      security:
        - oauth2:
            - 'vouchers:view'
        - apiKey:
            - 'vouchers:view'
      x-required-scopes:
        anyOf:
          -
            - 'vouchers:view'
      responses:
        200:
          description: 'The periods.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/FiscalYearPeriods'
              examples:
                example:
                  value:
                    data:
                      fiscal_year_id: 7
                      status: OPEN
                      locked_until_date: '2026-03-15'
                      periods:
                        - start: '2026-02-01'
                          end: '2026-02-28'
                          locked: true
                          partly_locked: false
                        - start: '2026-03-01'
                          end: '2026-03-31'
                          locked: false
                          partly_locked: true
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/fiscal-years/{fiscalYear}/sie':
    parameters:
      - name: fiscalYear
        in: path
        required: true
        description: 'Fiscal year id.'
        schema:
          type: integer
        example: 7
    get:
      operationId: exportSie
      tags:
        - Bokföring
      summary: 'Export a fiscal year as SIE 4'
      description: 'The fiscal year as a SIE 4 file (SIE 4E): identification, chart of accounts, opening and closing balances, results and every posted voucher, encoded in CP437 (IBM437) with #KSUMMA. The same export as the app (ExportSie). Drafts are not included.'
      x-sv-summary: 'Hämta räkenskapsåret som SIE-fil'
      x-sv-description: 'Räkenskapsåret som SIE 4-fil i teckenkodningen CP437, med alla bokförda verifikationer.'
      security:
        - oauth2:
            - 'export:sie'
        - apiKey:
            - 'export:sie'
      x-required-scopes:
        anyOf:
          -
            - 'export:sie'
      responses:
        200:
          description: 'The SIE file (Content-Disposition: attachment).'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            'text/plain; charset=IBM437':
              schema:
                type: string
                format: binary
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /cost-centers:
    get:
      operationId: listCostCenters
      tags:
        - 'Kostnadsställen och projekt'
      summary: 'List cost centres'
      description: "The company's cost centres (SIE dimension 1)."
      x-sv-summary: 'Lista kostnadsställen'
      x-sv-description: 'Företagets kostnadsställen.'
      security:
        - oauth2:
            - 'vouchers:view'
