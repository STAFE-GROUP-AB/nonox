# The manual's screenshots, taken by `php artisan manual:screenshots` from
# the demo companies of IndustryDemoSeeder (never from real data).
#
# Each key is the image's path under public/bilder/manual, without .webp,
# and the article that shows it is usually the one with the same path.
#   foretag    the demo company: restaurang, cafe, butik, frisor,
#              (enskildfirma and handelsbolag come from TaxFormsDemoSeeder)
#              hantverkare, konsult, byra or ekonomikonsult
#   rutt       the route name in the app
#   modell     what fills the route's parameter: voucher, invoice,
#              rot_invoice, reverse_charge_invoice, supplier_invoice_to_approve
#              or company (the demo company itself)
#   fraga      the query string, as a map
#   enhet      dator (1280 × 800, the default) or mobil (390 × 844)
#   del        a CSS selector: crop the image to that element
#   klick      CSS selectors to click in order first (a tab, a dialog, a
#              menu); text=Moduler clicks the button or link with that text
#   visa       a CSS selector to scroll to the top of the window
#   anvandare  sign in as this made-up user (…@example.test) instead of the
#              owner, gast for no one signed in, or portal:<address> for a
#              made-up customer portal contact (…@….test)
#   text       what must be on the page (default: the demo company's name)
#   modell     may also be { tabell: …, dar: { column: value } }: the newest
#              row of that table in the company; portal_key is the company's
#              customer portal address

