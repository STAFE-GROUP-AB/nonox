# Företagsguiden sections, in menu order (docs/foretagsguiden/SKRIVREGLER.md).
starta:
  titel: Starta företaget
  beskrivning: Välj bolagsform, registrera företaget och kom i gång rätt från första dagen.
  ikon: rocket
moms-och-skatt:
  titel: Moms och skatt
  beskrivning: Hur moms, F-skatt och egenavgifter fungerar, och hur mycket av det du säljer som inte är dina pengar.
  ikon: receipt
ansvar-och-regler:
  titel: Ansvar och regler
  beskrivning: Vad lagen kräver av dig som driver företag, från bokföring och arkivering till ditt personliga ansvar.
  ikon: scale
viktiga-datum:
  titel: Viktiga datum
  beskrivning: När moms, arbetsgivardeklaration, preliminärskatt, inkomstdeklaration och årsredovisning ska vara inne och betalda, och vad du gör om du missar ett datum.
  ikon: calendar
vaxa:
  titel: Att växa
  beskrivning: Ta betalt rätt, håll koll på pengarna, hitta kunder, anställ din första medarbetare och byt företagsform när det är dags.
  ikon: chart
